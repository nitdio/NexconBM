<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email send test</title>
<style>
  body{font-family:sans-serif; max-width:480px; margin:3rem auto; padding:0 1rem;}
  label{display:block; margin-top:1rem; font-weight:600;}
  input, textarea{width:100%; padding:0.6em; margin-top:0.3em; box-sizing:border-box;}
  button{margin-top:1.5rem; padding:0.7em 1.4em; font-size:1rem; cursor:pointer;}
  .note{background:#fff8e1; border:1px solid #e0c36b; padding:1em; margin-bottom:1.5rem; font-size:0.9rem;}
</style>
</head>
<body>

<h1>Email send test</h1>

<div class="note">
  This is a one-off test page, not part of the real site. It sends real
  emails to <strong>ryantsee1000@gmail.com</strong> via a free third-party
  service called FormSubmit — no backend code needed.
</div>

<form action="https://formsubmit.co/ryantse1000@gmail.com" method="POST">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Your email</label>
  <input type="email" id="email" name="email" required>

  <label for="message">Message</label>
  <textarea id="message" name="message" rows="4" required></textarea>

  <!-- Plain-text email instead of FormSubmit's default table layout -->
  <input type="hidden" name="_template" value="basic">
  <!-- Optional: change the email subject line -->
  <input type="hidden" name="_subject" value="New test message from Nexcon site test">

  <button type="submit">Send test email</button>
</form>

</body>
</html>
